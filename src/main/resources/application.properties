# Conexión a MySQL en Docker
spring.datasource.url=jdbc:mysql://localhost:3306/db_ventas?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=user_ventas
spring.datasource.password=user12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración básica de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.main.web-application-type=servlet

# 1. Fuerza a que la inicialización por script siempre esté activa
spring.sql.init.mode=always

# 2. Indica la ruta explícita del script de inserción para evitar bloqueos
spring.sql.init.data-locations=classpath:import.sql

# Soluciona el conflicto de compatibilidad entre Spring Boot 2.7 y Swagger 3
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

spring.jpa.defer-datasource-initialization=true

